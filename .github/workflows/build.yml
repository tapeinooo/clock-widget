name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }} -PgitSha=${GITHUB_SHA::7}
      # main への書き込みだけ Releases に出す（アプリの「更新」はここから取る）
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(./gradlew -q --no-daemon printVersionName -PbuildNumber=${{ github.run_number }} | tail -1)
          TAG="v${NAME}"
          APK="${{ github.event.repository.name }}-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "$TAG" "$APK" --title "$TAG" --notes-file notes.txt --target "${{ github.sha }}"
          # 移行のため：v1.10 までのアプリは「latest」という名前のリリースの本文のコミット番号を見て更新する。
          # 新しい版の確認（releases/latest）に出ないよう、プレリリースにしておく
          cp "$APK" clock-widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest clock-widget.apk --prerelease --title "最新版（古い版の更新用）" --notes "コミット ${GITHUB_SHA::7}" --target "${{ github.sha }}"
