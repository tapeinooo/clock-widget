name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - "stage-recorder/**"
      - ".github/workflows/stage-recorder.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk clock-widget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest clock-widget.apk --title "最新版" --notes "コミット ${GITHUB_SHA::7}"
